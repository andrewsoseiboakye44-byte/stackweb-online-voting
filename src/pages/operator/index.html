<!-- Lucide Icons â€” pinned v0.408.0, single observer, RAF debounce -->
<script src="https://unpkg.com/lucide@0.408.0/dist/umd/lucide.min.js"></script>
<script>
  (function () {
    var _obs = null, _raf = null;
    function _run() {
      _raf = null;
      if (!window.lucide) return;
      if (_obs) _obs.disconnect();
      try { window.lucide.createIcons(); } catch (e) {}
      if (_obs) _obs.observe(document.body, { childList: true, subtree: true });
    }
    window.initIcons = function () {
      if (_raf) return; // already queued â€” skip
      _raf = requestAnimationFrame(_run);
    };
    document.addEventListener('DOMContentLoaded', function () {
      window.initIcons();
      if (!window.MutationObserver) return;
      _obs = new MutationObserver(function (mutations) {
        var hasIconEl = mutations.some(function (m) {
          return Array.from(m.addedNodes).some(function (n) {
            return n.nodeType === 1 && (
              (n.tagName === 'I' && n.hasAttribute && n.hasAttribute('data-lucide')) ||
              (n.tagName !== 'svg' && n.querySelector && n.querySelector('i[data-lucide]'))
            );
          });
        });
        if (hasIconEl) window.initIcons();
      });
      _obs.observe(document.body, { childList: true, subtree: true });
    });
  })();
</script>
